name: CMS Test
on:
  pull_request:
  push:
    branches:
      - main
      - automated-tests
jobs:
  test:
    name: Run Django tests
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: .ci/docker-compose.yml
      DATABASE_NAME: nsigned
      DATABASE_USERNAME: nsigned
      DATABASE_PASSWORD: nsigned
    steps:
    - name: Checkout
      uses: actions/checkout@v2
    - name: Build docker images
      run: docker-compose build
    - name: Start containers
      run: docker-compose up -d
    - name: Run tests
      run: docker-compose exec cms ./manage.py test
    - name: Tear down containerss
      if: always()
      run: docker-compose down
